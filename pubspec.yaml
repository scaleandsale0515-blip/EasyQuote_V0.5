name: easyquote
description: "EasyQuote — offline Quotation & Invoice manager for precast concrete factories."
publish_to: 'none'
version: 1.0.5+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  hive_ce: ^2.3.0
  hive_ce_flutter: ^2.3.0
  crypto: ^3.0.6
  pdf: ^3.11.3
  printing: ^5.13.4
  path_provider: ^2.1.5
  intl: ^0.19.0
  image_picker: ^1.1.2
  share_plus: ^11.1.0
  fl_chart: ^0.69.2
  file_picker: ^8.1.4

  # Excel export
  excel: ^4.0.6

  # PDF thumbnail rendering for template picker
  pdfx: ^2.9.0

  # Auto-backup to user-selected folder (Storage Access Framework)
  document_file_save_plus: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSans-Italic.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
